[System]
Archiver=file-roller
FallbackIconThemeName=Papirus-Dark
IconThemeName=Papirus-Dark
SuCommand=lxqt-sudo %s
Terminal=qterminal

[Behavior]
BookmarkOpenMethod=current_tab
ConfirmDelete=true
SingleClick=false
UseTrash=false

[Desktop]
BgColor=#181825
FgColor=#cdd6f4
Font="DejaVu Sans,10,-1,5,50,0,0,0,0,0"
ShadowColor=#000000
ShowHidden=false
ShowMounts=false
ShowTrash=false
ShowWallpaper=true
SortColumn=name
SortOrder=ascending
Wallpaper=/usr/share/wallpapers/maialinux/maialinux-tablet-neon.png
WallpaperMode=zoom

[FolderView]
BigIconSize=48
CompactIconSize=24
Mode=icon
SmallIconSize=32
ThumbnailIconSize=96

[Window]
FixedHeight=500
FixedWidth=750
SplitterPos=150

